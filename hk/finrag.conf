# 反代（香港轻量 43.128.8.126 → 境内 ECS 8.137.192.231），三服务共用域名 finrag.icu + 同一张证书，
# 对外端口与 ECS 端口一一对应：
#   https://finrag.icu:8000 → ECS:8000（服务A）  https://finrag.icu:8001 → ECS:8001（金融 RAG）
#   https://finrag.icu:8002 → ECS:8002（服务B）  http :80 → 301 跳 :8001
# 关键1：SSE 流式必须 proxy_buffering off + 长超时，否则前端推理/正文整包延迟。
# 关键2：Host 必须传 $server_addr（IP），传真实域名会被阿里云拦截未备案域名请求返回 403 备案页。
# 证书由 certbot 自动续期；certbot 重装证书会改写此文件，改完要复查 Host 行与 listen 行。
# 新增服务 = 复制一个 server 块，只改 listen 端口与 proxy_pass 目标端口。
server {
    listen 8000 ssl;
    server_name finrag.icu;
    ssl_certificate /etc/letsencrypt/live/finrag.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finrag.icu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://8.137.192.231:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $server_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 8001 ssl;
    server_name finrag.icu;
    ssl_certificate /etc/letsencrypt/live/finrag.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finrag.icu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://8.137.192.231:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $server_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查直通（面试前自查用）
    location = /health {
        proxy_pass http://8.137.192.231:8001;
        proxy_set_header Host $server_addr;
        proxy_buffering off;
    }
}

server {
    listen 8002 ssl;
    server_name finrag.icu;
    ssl_certificate /etc/letsencrypt/live/finrag.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finrag.icu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://8.137.192.231:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $server_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name finrag.icu;
    return 301 https://$host:8001$request_uri;
}
